doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            app_uuid: App\Shared\Doctrine\UuidStringType
        # Tables managed by hand-written migrations (append-only audit log, counters).
        schema_filter: ~^(?!(audit_log|audit_chain_head|document_sequence|messenger_messages)$)~
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        enable_native_lazy_objects: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        report_fields_where_declared: true
        auto_mapping: false
        controller_resolver:
            auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
