security:
    password_hashers:
        App\Modules\Account\Account: 'auto'

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    providers:
        account_by_email:
            entity: { class: App\Modules\Account\Account, property: emailAddress }
        account_by_id:
            entity: { class: App\Modules\Account\Account, property: id }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false

        login:
            pattern: ^/api/v1/auth/login$
            stateless: true
            provider: account_by_email
            user_checker: App\Modules\Account\Security\UserChecker
            json_login:
                check_path: /api/v1/auth/login
                username_path: email
                password_path: password
                success_handler: App\Modules\Account\Security\LoginSuccessHandler
                failure_handler: App\Modules\Account\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # The refresh token itself is the credential for these endpoints.
        token:
            pattern: ^/api/v1/auth/(refresh|logout)$
            security: false

        health:
            pattern: ^/api/v1/health$
            security: false

        api:
            pattern: ^/
            stateless: true
            provider: account_by_id
            user_checker: App\Modules\Account\Security\UserChecker
            jwt: ~

    access_control:
        - { path: ^/api/v1/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Modules\Account\Account:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
