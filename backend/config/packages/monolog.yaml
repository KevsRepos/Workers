monolog:
    channels:
        - deprecation
        - audit

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event']
            audit:
                type: stream
                path: '%kernel.logs_dir%/audit.log'
                level: info
                channels: [audit]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ['!event']
            nested:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug

when@prod:
    monolog:
        handlers:
            # Structured JSON logs on stderr (collected by the container runtime / log shipper).
            main:
                type: stream
                path: php://stderr
                level: info
                channels: ['!event', '!doctrine', '!deprecation', '!audit']
                formatter: monolog.formatter.json
            # Audit events additionally go to stdout for forwarding to a SIEM / WORM storage.
            audit:
                type: stream
                path: php://stdout
                level: info
                channels: [audit]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!audit']
