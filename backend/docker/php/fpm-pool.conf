[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /fpm-ping
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
